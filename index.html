<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>跳び箱AI採点システム Ver3.0</title>

    <link rel="stylesheet" href="style.css">

    <!-- MediaPipe Pose -->
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils"></script>
   

</head>

<body>

<div class="container">

    <h1>🏃 跳び箱AI採点システム</h1>

    <div class="card">

        <label>生徒名</label>

        <input
            type="text"
            id="studentName"
            placeholder="名前を入力">

        <label>技</label>

        <select id="skill">

            <option>開脚跳び</option>
            <option>閉脚跳び</option>
            <option>台上前転</option>

        </select>

        <label>動画を選択</label>

        <input
            type="file"
            id="videoFile"
            accept="video/*">

        <div id="videoContainer">

            <video
                id="video"
                controls
                playsinline>
            </video>

            <canvas id="outputCanvas"></canvas>

        </div>

        <br>

        <button id="detectBtn">

            骨格検出開始

        </button>

    </div>

    <div class="result">

        <h2>AI解析結果</h2>

        <p id="status">

            動画を読み込んでください

        </p>

    </div>

</div>

<script type="module" src="app.js"></script>

</body>

</html>
